<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sydney Housing Price Predictor</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 { font-size: 28px; margin-bottom: 4px; }
        p.intro { color: #444; margin-bottom: 24px; }
        form {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-top: 14px;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 22px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            background: #222;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .result {
            margin-top: 28px;
            padding: 20px;
            border-radius: 8px;
            background: #f4f4f4;
        }
        .result h2 { margin: 0 0 8px 0; font-size: 24px; }
        .note { color: #555; font-size: 14px; margin-top: 8px; }
        .caveat { color: #777; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Sydney Housing Price Predictor</h1>
    <p class="intro">
        Enter a property's details below to get a predicted sale price.
        The model was trained on 105 sold properties across Chatswood, Sydney CBD,
        and Liverpool (sold March to August 2026).
    </p>

    <form method="post">
        <div class="row">
            <div>
                <label for="suburb">Suburb</label>
                <select name="suburb" id="suburb">
                    {% for s in suburbs %}
                        <option value="{{ s }}" {% if form_values.suburb == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>

                <label for="property_type">Property type</label>
                <select name="property_type" id="property_type">
                    {% for pt in property_types %}
                        <option value="{{ pt }}" {% if form_values.property_type == pt %}selected{% endif %}>{{ pt }}</option>
                    {% endfor %}
                </select>

                <label for="bedrooms">Bedrooms</label>
                <input type="number" name="bedrooms" id="bedrooms" min="0" max="10" value="{{ form_values.bedrooms }}">

                <label for="bathrooms">Bathrooms</label>
                <input type="number" name="bathrooms" id="bathrooms" min="0" max="10" value="{{ form_values.bathrooms }}">

                <label for="parking_spaces">Parking spaces</label>
                <input type="number" name="parking_spaces" id="parking_spaces" min="0" max="10" value="{{ form_values.parking_spaces }}">
            </div>
            <div>
                <label for="distance_to_cbd_km">Distance to CBD (km)</label>
                <input type="number" step="0.01" name="distance_to_cbd_km" id="distance_to_cbd_km" value="{{ form_values.distance_to_cbd_km }}">

                <label for="distance_to_station_km">Distance to nearest station (km)</label>
                <input type="number" step="0.01" name="distance_to_station_km" id="distance_to_station_km" value="{{ form_values.distance_to_station_km }}">

                <label for="land_size_sqm">Land size (sqm, leave at 0 if not applicable, e.g. apartments/units)</label>
                <input type="number" step="1" name="land_size_sqm" id="land_size_sqm" value="{{ form_values.land_size_sqm }}">

                <label for="internal_area_sqm">Internal floor area (sqm, leave at 0 if unknown)</label>
                <input type="number" step="1" name="internal_area_sqm" id="internal_area_sqm" value="{{ form_values.internal_area_sqm }}">
            </div>
        </div>

        <button type="submit">Predict price</button>
    </form>

    {% if prediction %}
    <div class="result">
        <h2>Predicted sale price: {{ prediction }}</h2>
    </div>
    {% endif %}
</body>
</html>
